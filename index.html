<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>米家场景实验室</title>
  <style>
    :root {
      --bg: #f4f6fb;
      --panel: #ffffff;
      --ink: #1a2233;
      --ink-2: #5b6472;
      --ink-3: #8a93a3;
      --line: #e6e9f0;
      --brand: #2563eb;
      --brand-2: #7c5cff;
      --brand-soft: #eef4ff;
      --danger: #dc2626;
      --danger-soft: #fdecec;
      --warn: #b26a00;
      --ok: #16a34a;
      --radius: 14px;
      --shadow: 0 1px 3px rgba(16, 24, 40, .06), 0 1px 2px rgba(16, 24, 40, .04);
      --shadow-lg: 0 8px 24px rgba(16, 24, 40, .08);
      --font: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      --mono: ui-monospace, "SF Mono", Consolas, "Courier New", monospace;
    }
    * { box-sizing: border-box; }
    body { font-family: var(--font); margin: 0; background: var(--bg); color: var(--ink); font-size: 14px; line-height: 1.6; }
    a { color: var(--brand); text-decoration: none; }
    a:hover { text-decoration: underline; }

    header {
      background: linear-gradient(180deg, #ffffff, #fbfcff);
      border-bottom: 1px solid var(--line);
      padding: 18px 24px 16px;
    }
    .header-inner { max-width: 1120px; margin: 0 auto; display: flex; align-items: center; gap: 14px; }
    .logo {
      width: 40px; height: 40px; border-radius: 11px; flex: none;
      background: linear-gradient(135deg, var(--brand), var(--brand-2));
      color: #fff; display: flex; align-items: center; justify-content: center;
      font-size: 20px; font-weight: 700; box-shadow: 0 4px 10px rgba(37, 99, 235, .28);
    }
    .header-text h1 { margin: 0; font-size: 18px; letter-spacing: .5px; }
    .header-text p { margin: 2px 0 0; color: var(--ink-2); font-size: 12.5px; }
    .badge {
      margin-left: auto; display: inline-flex; align-items: center; gap: 6px;
      background: #eefaf1; color: var(--ok); border: 1px solid #c9ecd4;
      font-size: 12px; font-weight: 600; padding: 5px 12px; border-radius: 999px; white-space: nowrap;
    }
    .badge::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--ok); }

    main { max-width: 1120px; margin: 26px auto 40px; padding: 0 18px; }

    #drop {
      border: 2px dashed #c3cbdc; border-radius: var(--radius); padding: 42px 20px; text-align: center;
      background: var(--panel); cursor: pointer; transition: all .18s ease; position: relative;
      box-shadow: var(--shadow);
    }
    #drop:hover { border-color: var(--brand); }
    #drop.over { border-color: var(--brand); background: var(--brand-soft); transform: scale(1.008); box-shadow: var(--shadow-lg); }
    #drop .drop-icon { width: 46px; height: 46px; margin: 0 auto 12px; color: var(--brand); }
    #drop strong { font-size: 16px; }
    #drop .drop-sub { color: var(--ink-3); font-size: 12.5px; margin-top: 4px; }
    #file-name { display: none; margin-top: 10px; font-size: 12.5px; color: var(--brand); font-weight: 600; }
    #drop.loaded #file-name { display: block; }
    #drop.loaded .drop-hint { opacity: .55; }

    #error {
      display: none; margin-top: 14px; padding: 12px 16px; border-radius: 10px;
      background: var(--danger-soft); color: var(--danger); white-space: pre-wrap;
      border-left: 4px solid var(--danger); font-size: 13px;
    }

    nav {
      display: flex; gap: 6px; margin: 20px 0 16px; flex-wrap: wrap;
      background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 5px; width: fit-content;
      box-shadow: var(--shadow);
    }
    nav button {
      padding: 8px 16px; border: none; border-radius: 9px; background: transparent; cursor: pointer;
      color: var(--ink-2); font-size: 13.5px; font-weight: 500; transition: all .15s ease; font-family: inherit;
    }
    nav button:hover { background: var(--brand-soft); color: var(--brand); }
    nav button.active { background: linear-gradient(135deg, var(--brand), var(--brand-2)); color: #fff; box-shadow: 0 3px 8px rgba(37, 99, 235, .25); }

    section {
      display: none; background: var(--panel); border-radius: var(--radius); padding: 22px;
      border: 1px solid var(--line); box-shadow: var(--shadow);
    }
    section.active { display: block; animation: fadein .18s ease; }
    @keyframes fadein { from { opacity: 0; transform: translateY(3px); } to { opacity: 1; transform: none; } }

    h3 { font-size: 15px; margin: 18px 0 10px; padding-left: 10px; border-left: 3px solid var(--brand); }
    h3:first-child { margin-top: 0; }
    pre { white-space: pre-wrap; font-size: 13px; line-height: 1.7; background: #f8f9fc; border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; margin: 0; }
    .warn { color: var(--warn); }

    svg { width: 100%; height: auto; border: 1px solid var(--line); border-radius: 10px;
      background-image: radial-gradient(circle, #dde3ee 1px, transparent 1px); background-size: 22px 22px; }
    .edge-event { stroke: var(--brand); stroke-width: 2; fill: none; }
    .edge-state { stroke: #1f9d55; stroke-width: 2; fill: none; }
    .edge-both { stroke: #d97706; stroke-width: 2; fill: none; }
    .node { cursor: default; }
    .node:hover .node-bg { stroke: #9aa8c4; }
    .node-bg { fill: #fff; stroke: #dfe3e8; stroke-width: 1.5; }
    .node-head-text { font-size: 11px; fill: #fff; font-weight: 600; }
    .node-title { font-size: 13px; fill: #1f2328; font-weight: 600; }
    .node-sub { font-size: 11px; fill: #6b7280; }
    .pin { stroke: #fff; stroke-width: 1; }
    .pin-in { fill: #9aa1ab; }
    .pin-event { fill: var(--brand); }
    .pin-state { fill: #1f9d55; }
    .pin-both { fill: #d97706; }
    @keyframes firedpulse { 0% { stroke-width: 3; } 50% { stroke-width: 6; stroke: var(--brand-2); } 100% { stroke-width: 3; } }
    .node.fired .node-bg { stroke: var(--brand); stroke-width: 3; animation: firedpulse 1.1s ease-in-out 2; }

    table { border-collapse: collapse; width: 100%; font-size: 13px; }
    th { text-align: left; background: #f7f8fb; color: var(--ink-2); font-weight: 600; }
    th, td { padding: 9px 12px; border-bottom: 1px solid var(--line); }
    tr:last-child td { border-bottom: none; }
    tbody tr:hover { background: #fafbfe; }
    td input[type="checkbox"] { width: 16px; height: 16px; accent-color: var(--brand); }
    td input[type="number"] { width: 90px; padding: 4px 8px; border: 1px solid var(--line); border-radius: 6px; font: inherit; }

    button { font-family: inherit; cursor: pointer; }
    .sim-panel button, .edit-side button, .ai-grid button {
      margin: 2px 6px 2px 0; padding: 6px 13px; border: 1px solid var(--line); border-radius: 8px;
      background: #fff; color: var(--ink); font-size: 13px; transition: all .15s ease;
    }
    .sim-panel button:hover, .edit-side button:hover, .ai-grid button:hover { border-color: var(--brand); color: var(--brand); background: var(--brand-soft); }
    .sim-panel button:disabled, .ai-grid button:disabled { opacity: .5; cursor: not-allowed; }
    #btn-apply, #btn-export, #do-sanitize, #ai-go {
      background: linear-gradient(135deg, var(--brand), var(--brand-2)); color: #fff; border: none;
      box-shadow: 0 2px 6px rgba(37, 99, 235, .22);
    }
    #btn-apply:hover, #btn-export:hover, #do-sanitize:hover, #ai-go:hover { color: #fff; background: var(--brand); }

    .log-event { color: #6ea8ff; }
    .log-state { color: #52c98a; }
    .log-action { color: #ff8a7a; font-weight: 600; }
    .log-timer { color: #e8b95a; }
    .log-assume { color: #c0a5ff; }
    .log-query { color: #6fd0e0; }
    .log-warn { color: #ffa58f; }
    .sim-grid { display: grid; grid-template-columns: 340px 1fr; gap: 16px; }
    .sim-panel { background: #fafbfd; border: 1px solid var(--line); border-radius: 12px; padding: 14px; margin-bottom: 12px; }
    .sim-panel h4 { margin: 0 0 10px; font-size: 13px; color: var(--ink); letter-spacing: .3px; }
    .sim-panel table { font-size: 12px; }
    .sim-panel select { max-width: 100%; padding: 4px 6px; border: 1px solid var(--line); border-radius: 6px; font: inherit; }
    #sim-log {
      max-height: 420px; overflow: auto; background: #10141d; color: #d7dae0; border-radius: 10px;
      padding: 12px 14px; font: 12px/1.8 var(--mono); white-space: pre-wrap; margin-top: 6px;
      border: 1px solid #232a3a;
    }

    .edit-grid { display: grid; grid-template-columns: 1fr 320px; gap: 16px; }
    #edit-json {
      width: 100%; height: 470px; font: 12.5px/1.65 var(--mono); border: 1px solid var(--line);
      border-radius: 10px; padding: 12px 14px; resize: vertical; background: #fbfcfe; color: var(--ink);
    }
    #edit-json:focus { outline: none; border-color: var(--brand); box-shadow: 0 0 0 3px rgba(37, 99, 235, .12); }
    .edit-side h4 { margin: 16px 0 8px; font-size: 13px; }
    .edit-side select { width: 100%; padding: 6px 8px; border: 1px solid var(--line); border-radius: 8px; font: inherit; background: #fff; }

    .ai-grid { display: grid; grid-template-columns: 320px 1fr; gap: 16px; }
    .ai-grid .field { margin-bottom: 12px; }
    .ai-grid label { font-size: 12px; color: var(--ink-2); font-weight: 600; display: block; margin-bottom: 4px; }
    .ai-grid input, .ai-grid textarea {
      width: 100%; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; font: inherit;
      background: #fbfcfe; color: var(--ink);
    }
    .ai-grid input:focus, .ai-grid textarea:focus { outline: none; border-color: var(--brand); box-shadow: 0 0 0 3px rgba(37, 99, 235, .12); }
    #ai-status { font-size: 12.5px; color: var(--ink-2); margin-top: 10px; }

    footer { max-width: 1120px; margin: 0 auto; padding: 8px 18px 30px; color: var(--ink-3); font-size: 12px; text-align: center; }
    footer a { color: var(--ink-2); }

    @media (max-width: 860px) {
      .sim-grid, .edit-grid, .ai-grid { grid-template-columns: 1fr; }
      .badge { display: none; }
    }
  </style>
</head>
<body>
  <header>
    <div class="header-inner">
      <div class="logo">米</div>
      <div class="header-text">
        <h1>米家场景实验室</h1>
        <p>米家自动化极客版场景备份(.bak)· 解读 · 模拟 · 编辑 · AI 生成</p>
      </div>
      <span class="badge">纯本地处理 · 文件不上传</span>
    </div>
  </header>
  <main>
    <div id="drop">
      <svg class="drop-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 16V4m0 0L7.5 8.5M12 4l4.5 4.5"/>
        <path d="M4 15v3a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3"/>
      </svg>
      <div class="drop-hint"><strong>拖入或点击选择 .bak 文件</strong></div>
      <div class="drop-sub">或 <a href="tests/fixtures/home-sanitized.bak" download>下载演示数据(已脱敏)</a> 后拖入</div>
      <div id="file-name"></div>
      <input id="file" type="file" accept=".bak" hidden>
    </div>
    <div id="error"></div>
    <nav id="tabs" hidden>
      <button data-tab="overview" class="active">总览</button>
      <button data-tab="devices">设备清单</button>
      <button data-tab="graph">流程图</button>
      <button data-tab="summary">中文解读</button>
      <button data-tab="sim">模拟</button>
      <button data-tab="edit">编辑</button>
      <button data-tab="ai">AI 生成</button>
      <button data-tab="sanitize">脱敏导出</button>
    </nav>
    <section id="overview" class="active"></section>
    <section id="devices"></section>
    <section id="graph"></section>
    <section id="summary"></section>
    <section id="sim"></section>
    <section id="edit"></section>
    <section id="ai">
      <div class="ai-grid">
        <div class="sim-panel">
          <h4>接口设置(仅保存在本浏览器,只发送给你填写的端点)</h4>
          <div class="field">
            <label>Base URL</label>
            <input id="ai-base" value="https://api.deepseek.com/v1">
          </div>
          <div class="field">
            <label>模型</label>
            <input id="ai-model" value="deepseek-chat">
          </div>
          <div class="field">
            <label>API Key</label>
            <input id="ai-key" type="password" placeholder="sk-...">
          </div>
        </div>
        <div class="sim-panel">
          <h4>自然语言写场景</h4>
          <div class="field">
            <textarea id="ai-req" rows="7" placeholder="例如:晚上回家时,如果客厅温度超过 27 度就打开空调除湿模式并关窗,同时小爱欢迎我回家"></textarea>
          </div>
          <button id="ai-go">生成场景 JSON</button>
          <p id="ai-status"></p>
          <p style="font-size:12px;color:var(--ink-3)">提示词内置节点目录与 canonical 格式规范(来源 xgg node-catalog.md)。生成的 JSON 自动载入「编辑」页,预览/模拟确认后再导出 .bak 导入网关。</p>
        </div>
      </div>
    </section>
    <section id="sanitize"></section>
  </main>
  <footer>
    仅本地解析,与小米公司无关 · 语义依据 xgg 文档整理,未经全面实机验证 ·
    <a href="https://github.com/lirenjie95/mihome-scene-lab">GitHub 仓库</a>
  </footer>
  <script type="module" src="src/app.js"></script>
</body>
</html>
